networks:
  clausis-net:
    driver: bridge

services:
  frontend:
    build:
      # Compose resolves a relative build context against this file's
      # directory, not the shell's cwd — Reservation_System_Frontend is a
      # sibling of Reservation_System, hence the ../.
      context: ../Reservation_System_Frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "5173:8080"
    networks:
      - clausis-net
    depends_on:
      clausis-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clausis-api:
    build: .
    ports:
      - "8080:8080"
    networks:
      - clausis-net
    environment:
      - SERVER_PORT=8080
      # Deliberately NOT 'dev' or 'prod': the 'dev' profile forces
      # spring.jpa.hibernate.ddl-auto=update, which would fight with Flyway
      # (already enabled below) over schema ownership against this *real*
      # Postgres instance. 'prod' forces sslmode=require, which this local
      # Postgres container doesn't serve. No application-docker.properties
      # exists, so this profile contributes nothing — base application.yml's
      # ddl-auto=validate stands, matching how Flyway-managed schemas should
      # actually be validated.
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/clausis_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
      - PII_SECRET_KEY=${PII_SECRET_KEY:-0123456789abcdef0123456789abcdef}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_dummy}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_dummy}
      - SMTP_PW=${SMTP_PW:-dummy_password}
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus,metrics
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://tempo:9411/api/v2/spans
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
      # Internal listener (see kafka service below) — NOT the host-facing
      # localhost:9092 advertised listener, which would be unreachable from
      # inside this container.
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      # Container-internal URLs — the browser never talks to Keycloak directly
      # (see KeycloakIdentityService); only this backend does, server-to-server.
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/clausis-realm/protocol/openid-connect/certs
      - KEYCLOAK_REALM=clausis-realm
      - KEYCLOAK_CLIENT_ID=clausis-backend
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-clausis-backend-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

  keycloak-postgres:
    image: postgres:16-alpine
    networks:
      - clausis-net
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
      - POSTGRES_DB=keycloak_db
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    # start-dev (not start): this is local/dev infra like the rest of this
    # compose file's dummy secrets — start's production hardening (HTTPS
    # enforcement, hostname strictness) would just get in the way here.
    # --import-realm loads docker/keycloak/realm-export.json on every boot;
    # Keycloak skips re-importing a realm that already exists, so this is
    # safe across container restarts against the same keycloak-postgres volume.
    command: start-dev --import-realm
    networks:
      - clausis-net
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-postgres:5432/keycloak_db
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8081:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      # Verified against a real run: Keycloak 24 serves /health/ready on the
      # same main port as everything else (no separate management port until
      # later Keycloak versions) — no curl/wget binary in this image, hence bash's /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    networks:
      - clausis-net
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=clausis_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - clausis-net
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    networks:
      - clausis-net
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:latest
    networks:
      - clausis-net
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:latest
    networks:
      - clausis-net
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml

  tempo:
    image: grafana/tempo:latest
    networks:
      - clausis-net
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "9411:9411" # Zipkin port

  grafana:
    image: grafana/grafana:latest
    networks:
      - clausis-net
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    ports:
      - "9092:9092"
    networks:
      - clausis-net
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      # Two listeners: PLAINTEXT (host access via the published port, advertised
      # as localhost) and INTERNAL (container-to-container traffic on the compose
      # network, advertised as the 'kafka' service name). A single-listener setup
      # advertised as localhost only works for clients on the host machine —
      # every other container would be told to reconnect to itself.
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
      # Must be a base64-encoded 16-byte UUID (22 chars, no padding) — KRaft
      # rejects a hyphenated UUID string like the one this previously held.
      - CLUSTER_ID=dVNOaappTICgMs91ErL8rg
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # Tests the broker is actually accepting client protocol connections, not
      # just that the container process has started — service_started on this
      # service previously let clausis-api attempt to connect before Kafka's
      # KRaft startup (storage format + broker registration) had finished.
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  keycloak_postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
