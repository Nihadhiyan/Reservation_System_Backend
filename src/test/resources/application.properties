app.security.pii-secret=0123456789abcdef0123456789abcdef
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Explicit rather than inheriting main application.yml's default: this file
# fully shadows application.yml for @SpringBootTest runs (both exist at the
# same classpath location), so without this, ddl-auto silently falls back to
# Spring Boot's embedded-database default (create-drop) — which is exactly
# what let Flyway's migrations drift out of sync with the entities undetected
# until a real (non-embedded) Postgres instance exposed it. validate here
# makes tests catch that class of bug instead of masking it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.cors.allowed-origins=http://localhost:5173

# Same shadowing issue as ddl-auto above: application.yml's spring.kafka.producer/
# consumer JSON (de)serializer config isn't inherited here, so @SpringBootTest runs
# fall back to Spring Kafka's raw default (StringSerializer/StringDeserializer),
# which can't send/receive a PaymentCompletedEvent object. Declared explicitly so
# Kafka integration tests exercise the same (de)serialization config production uses.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.consumer.group-id=clausis-reservation-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bookfair.backend.*

